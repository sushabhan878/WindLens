name: Verify WindLens
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Container smoke check
        run: |
          python - <<'PY'
          import json, urllib.request
          root = 'http://localhost:8000'
          assert urllib.request.urlopen(root).status == 200
          with urllib.request.urlopen(root + '/api/summary') as r:
              data = json.load(r)
          assert data['counts']['matched_pairs'] == 744
          assert data['metrics']['mae'] > 0
          PY
      - if: always()
        run: docker compose down
